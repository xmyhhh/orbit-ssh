name: Release

on:
  push:
    tags:
      - 'v*'
      - 'ci-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签，例如 v3.1'
        required: true
        type: string
      dry-run:
        description: '只构建并上传产物，不创建 Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # A ci-* tag or a dry run only builds the artifacts, so a test never
  # publishes a release by accident.
  DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) || startsWith(github.ref_name, 'ci-') }}
  GO_VERSION: '1.24'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.11.0'

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            asset: macos-arm64
            tags: ''
            args: ''
          - os: macos-26-intel
            platform: darwin/amd64
            asset: macos-x64
            tags: ''
            args: ''
          - os: windows-latest
            platform: windows/amd64
            asset: windows-x64
            tags: ''
            # The installer ships the WebView2 bootstrapper, so the app uses the
            # runtime that is already installed.
            args: '-webview2 browser'
          - os: ubuntu-24.04
            platform: linux/amd64
            asset: linux-x64
            # Ubuntu 24.04 only ships WebKitGTK 4.1, so the ABI tag is
            # required. Without it the build looks for webkit2gtk-4.0.
            tags: '-tags webkit2_41'
            args: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dbus libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve the asset version
        shell: bash
        run: |
          set -euo pipefail
          app="$(node -p "require('./wails.json').info.productVersion.split('.').slice(0,2).join('.')")"
          if [ "$DRY_RUN" = "true" ]; then
            echo "ASSET_VERSION=$app" >> "$GITHUB_ENV"
          else
            echo "ASSET_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          fi

      - name: Check the version against the tag
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The first two segments carry the version line, so tags like v3.3
          # and patch releases like v3.3.1 both go through the same rule.
          tag="$(echo "${RELEASE_TAG#v}" | cut -d. -f1,2)"
          app="$(node -p "require('./wails.json').info.productVersion.split('.').slice(0,2).join('.')")"
          pkg="$(node -p "require('./frontend/package.json').version.split('.').slice(0,2).join('.')")"
          if [ "$tag" != "$app" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $RELEASE_TAG does not match wails.json ($app) or frontend/package.json ($pkg)"
            exit 1
          fi

      - name: Install frontend dependencies and run tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend test
          # Bindings are generated, not checked in. Go embed needs dist to
          # exist before Wails can generate them on a clean checkout.
          mkdir -p frontend/dist
          touch frontend/dist/gitkeep
          wails generate module ${{ matrix.tags }}
          npm --prefix frontend run build

      - name: Test the Go application
        shell: bash
        run: |
          set -euo pipefail
          go test ${{ matrix.tags }} ./...
          go test -tags androidtest ./...
          go vet ${{ matrix.tags }} ./...

      - name: Test the macOS native termination handshake
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -framework Cocoa -framework CoreFoundation \
            scripts/tests/macos-termination.m -o "$RUNNER_TEMP/orbit-termination-test"
          "$RUNNER_TEMP/orbit-termination-test"

      - name: Build the application
        run: wails build -platform ${{ matrix.platform }} ${{ matrix.args }} ${{ matrix.tags }}

      - name: Sign the macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Wails does not sign the bundle, so an unsigned download opens with
          # "Orbit SSH is damaged and can't be opened" on a Mac that carries
          # the quarantine attribute. Signing the bundle fixes that; a
          # Developer ID signature plus a stapled ticket removes the
          # Gatekeeper prompt as well.
          app='build/bin/Orbit SSH.app'
          keychain="$RUNNER_TEMP/signing.keychain-db"
          identity='-'
          notarize=0
          if [ -n "${MACOS_CERTIFICATE_P12:-}" ] && [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security create-keychain -p "$RUNNER_TEMP" "$keychain"
            security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
            security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain"
            rm -f "$RUNNER_TEMP/signing.p12"
            identity="$MACOS_SIGN_IDENTITY"
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              notarize=1
            else
              echo '::warning::No notarization credentials found; the app is signed but not notarized.'
            fi
          else
            echo '::warning::No Developer ID certificate configured; signing ad-hoc. macOS still asks the user to confirm the app on the first launch.'
          fi
          args=(--identity "$identity")
          if [ "$identity" != '-' ]; then
            args+=(--keychain "$keychain")
          fi
          if [ "$notarize" -eq 1 ]; then
            args+=(--notarize)
          fi
          ./scripts/sign-macos.sh "$app" "${args[@]}"

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${ASSET_VERSION}"
          mkdir -p dist
          app='build/bin/Orbit SSH.app'
          # The disk image carries the bundle, a symlink to /Applications and a
          # short note, so the user drags the app into place.
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          ditto "$app" "$staging/Orbit SSH.app"
          ln -s /Applications "$staging/Applications"
          cp LICENSE "$staging/LICENSE.txt"
          cp build/darwin/README.txt "$staging/README.txt"
          hdiutil create -volname "Orbit SSH" -srcfolder "$staging" -ov -format UDZO \
            "dist/OrbitSSH-v${version}-${{ matrix.asset }}.dmg"
          # ditto keeps the bundle layout, the symlinks and the permissions.
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "dist/OrbitSSH-v${version}-${{ matrix.asset }}.zip"
          ls -l dist

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          # The portable archive and the installer are built by the same
          # script as the local release, so both contain the license, the
          # readme and the WebView2 bootstrapper.
          ./scripts/package-windows.ps1 -SkipBuild -ReleaseLabel "v${{ env.ASSET_VERSION }}" -OutputDirectory dist
          Get-ChildItem dist | Select-Object Name, Length

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${ASSET_VERSION}"
          mkdir -p dist
          tar -czf "dist/OrbitSSH-v${version}-${{ matrix.asset }}.tar.gz" -C build/bin OrbitSSH

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The release notes live in the repository, so the sources are needed to
      # read them.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare the release notes
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            printf '## Orbit SSH %s\n\nSee the assets to download this version.\n' "$RELEASE_TAG" > release-notes.md
          fi

      - name: Create the release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Orbit SSH ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            assets/*
